name: pocket_astro
description: Vedic and Western astrology — charts, kundli matching, forecasts, and Q&A, computed on-device.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0
  equatable: ^2.0.7
  go_router: ^16.0.0
  http: ^1.6.0
  intl: ^0.20.2
  timezone: ^0.10.1
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  pdf: ^3.11.0
  printing: ^5.14.0
  share_plus: ^11.1.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/atlas/
    - assets/kb/
    - assets/kb/i18n/ne/
    - assets/kb/i18n/hi/
